name: Build BAS Lock APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable BAS Lock signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bas-lock-debug-keystore-v1

      - name: Restore permanent signing key when configured
        shell: bash
        env:
          BAS_LOCK_KEYSTORE_B64: ${{ secrets.BAS_LOCK_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$BAS_LOCK_KEYSTORE_B64" ]; then
            printf '%s' "$BAS_LOCK_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Verify stable signing key exists
        shell: bash
        run: |
          if [ ! -s ~/.android/debug.keystore ]; then
            echo "::error::BAS Lock signing keystore is missing. Refusing to generate a different signature and risk existing app data."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BAS-Lock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
